name: datamine publish

# Push a version tag to publish, e.g. git tag datamine-v0.1.0 && git push origin datamine-v0.1.0
# The tag version must match packages/datamine/package.json "version".
# Prerelease versions publish to the npm dist-tag "next", not "latest".
#
# npm trusted publishing (OIDC): configure Blam-Network/tiger -> datamine-publish.yml on npm.
# Do not set registry-url on setup-node (avoids a broken always-auth .npmrc); npm publish
# exchanges the GitHub OIDC token at publish time. Use a current npm CLI, see npm/cli#9088.
on:
  push:
    tags:
      - "datamine-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#datamine-v}"
          PKG_VERSION=$(node -p "require('./packages/datamine/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - run: npm ci
      - run: npx ultracite check packages/datamine
      - run: npm run typecheck -w packages/datamine
      - run: npx vitest run packages/datamine
      - run: npm run build -w packages/datamine

      - name: Publish to npm
        working-directory: packages/datamine
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          NPM_TAG=latest
          if echo "$PKG_VERSION" | grep -q '-'; then
            NPM_TAG=next
          fi
          echo "Publishing @blamnetwork/datamine@${PKG_VERSION} with dist-tag ${NPM_TAG}"
          npx npm@latest publish --provenance --access public --tag "$NPM_TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "@blamnetwork/datamine ${{ github.ref_name }}"
          generate_release_notes: true
