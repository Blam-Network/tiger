name: release

# scripts/release.mjs pushes a `<package dir>-v<version>` tag.
on:
  push:
    # datamine has its own workflow (datamine-publish.yml) for npm trusted publishing;
    # bullshcript-debugger-v tags are app builds (bullshcript-debugger.yml), not npm.
    tags: ["*-v*", "!datamine-v*", "!bullshcript-debugger-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - name: publish
        run: |
          dir="${GITHUB_REF_NAME%-v*}"
          npm publish --provenance --access public -w "packages/$dir"
