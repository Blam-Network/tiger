name: bullshcript debugger

# Builds the bullshcript debugger app for Windows, macOS and Linux whenever it
# changes. A branch push tags the commit bullshcript-debugger-v{build string},
# the Bungie-style {seq}.{yy}.{mm}.{dd}.{hhmm}.{branch} (see the app's
# scripts/compute-build-string.mjs), and a push to main also publishes a release
# on that tag with the installers, which the app's update check looks for.
# Pull requests build as "untracked version", untagged.
#
# Bundle targets are listed in src-tauri/tauri.conf.json (JSON has no comments,
# so it is noted here): nsis, dmg, app, deb, rpm, appimage; each runner builds
# its own. "all" would add msi, and WiX needs every version part to be 255 or
# less, but the bundle version is 0.{seq}.0 and seq is the run number. macOS
# builds are unsigned and not notarized.
on:
  push:
    branches:
      - "**"
    paths:
      - packages/bullshcript-debugger/**
      - .github/workflows/bullshcript-debugger.yml
  pull_request:
    paths:
      - packages/bullshcript-debugger/**
      - .github/workflows/bullshcript-debugger.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bullshcript-debugger-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: packages/bullshcript-debugger

jobs:
  prepare:
    name: Prepare build string
    runs-on: ubuntu-latest
    outputs:
      build_string: ${{ steps.compute.outputs.build_string }}
      build_info: ${{ steps.compute.outputs.build_info }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute build string
        id: compute
        shell: bash
        env:
          BSDBG_BRANCH: ${{ github.ref_name }}
          BSDBG_SEQ: ${{ github.run_number }}
          BSDBG_UNTRACKED: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: |
          INFO=$(node scripts/compute-build-string.mjs)
          BUILD_STRING=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).buildString)" "$INFO")
          echo "build_info=$INFO" >> "$GITHUB_OUTPUT"
          echo "build_string=$BUILD_STRING" >> "$GITHUB_OUTPUT"
          echo "Computed build string: $BUILD_STRING"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
          - platform: macos-latest
            name: macos
          - platform: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.platform }}
    env:
      BSDBG_BUILD_INFO: ${{ needs.prepare.outputs.build_info }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/bullshcript-debugger/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/bullshcript-debugger/src-tauri -> target

      # The app is not a workspace of the monorepo; gibbon is a file: link it
      # only reads the version of, so nothing in the monorepo needs building.
      - run: npm ci

      # The bundle version is 0.{seq}.0; tauri.conf.json and Cargo.toml keep their committed 0.1.0.
      - name: Write Tauri version config
        shell: bash
        run: |
          node -e "require('fs').writeFileSync('tauri.version.json', JSON.stringify({ version: JSON.parse(process.env.BSDBG_BUILD_INFO).packageVersion }))"
          cat tauri.version.json

      - name: Build the app
        run: npx tauri build --config tauri.version.json

      - name: Name the installers after the build string
        shell: bash
        env:
          BUILD_STRING: ${{ needs.prepare.outputs.build_string }}
          PLATFORM: ${{ matrix.name }}
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/release/bundle
          NAME="bullshcript-debugger-${BUILD_STRING// /-}"
          mkdir -p staging
          case "$PLATFORM" in
            windows)
              cp "$BUNDLE"/nsis/*.exe "staging/${NAME}-setup.exe"
              cp src-tauri/target/release/bullshcript-debugger.exe "staging/${NAME}.exe"
              ;;
            macos)
              cp "$BUNDLE"/dmg/*.dmg "staging/${NAME}.dmg"
              APP=$(ls -d "$BUNDLE"/macos/*.app)
              tar -czf "staging/${NAME}.app.tar.gz" -C "$(dirname "$APP")" "$(basename "$APP")"
              ;;
            linux)
              cp "$BUNDLE"/deb/*.deb "staging/${NAME}.deb"
              cp "$BUNDLE"/rpm/*.rpm "staging/${NAME}.rpm"
              cp "$BUNDLE"/appimage/*.AppImage "staging/${NAME}.AppImage"
              ;;
          esac
          ls -l staging

      - uses: actions/upload-artifact@v4
        with:
          name: bullshcript-debugger-${{ matrix.name }}
          path: packages/bullshcript-debugger/staging/*
          if-no-files-found: error

  tag:
    name: Tag build
    needs: [prepare, build]
    # Tag even when a build fails: seq is the run number and has to stay unique per commit.
    if: always() && github.event_name != 'pull_request' && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Create build tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BUILD_STRING: ${{ needs.prepare.outputs.build_string }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BUILD_STRING" || "$BUILD_STRING" == "untracked version" ]]; then
            echo "Refusing to tag untracked build"
            exit 1
          fi
          TAG="bullshcript-debugger-v${BUILD_STRING}"

          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 0
          fi

          TAG_OBJECT=$(gh api "repos/${REPO}/git/tags" \
            -f tag="$TAG" \
            -f message="bullshcript debugger $BUILD_STRING" \
            -f object="$SHA" \
            -f type=commit)
          TAG_SHA=$(printf '%s' "$TAG_OBJECT" | jq -r .sha)

          gh api "repos/${REPO}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="$TAG_SHA"
          echo "Tagged $SHA as $TAG"

  release:
    name: Release
    needs: [prepare, build, tag]
    # Only when every platform built and the tag exists.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bullshcript-debugger-*
          path: upload
          merge-multiple: true

      # The notes cover the commits since the previous debugger release, not
      # the monorepo's other releases. A re-run replaces the assets of the
      # release it already made.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BUILD_STRING: ${{ needs.prepare.outputs.build_string }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="bullshcript-debugger-v${BUILD_STRING}"
          ls -lh upload
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" upload/* --repo "$REPO" --clobber
            exit 0
          fi
          PREVIOUS=$(gh release list --repo "$REPO" --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("bullshcript-debugger-v"))][0].tagName // empty')
          gh release create "$TAG" upload/* --repo "$REPO" \
            --title "bullshcript debugger $BUILD_STRING" --verify-tag \
            --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
